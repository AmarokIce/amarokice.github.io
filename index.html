---
layout: default
---

<div class="home">
  <h1 class="page-heading">{{ site.title }}</h1>
  <ul class="post-list">
    {% for post in site.posts %} {% if post.type == 'blog' %} {% if post.pin ==
    true %}
    <li>
      <a class="post-link" href="{{ post.url | prepend: site.baseurl }}"
        >{{ post.title }}</a
      >
    </li>
    {% endif %} {% endif %} {% endfor %}
  </ul>
</div>
